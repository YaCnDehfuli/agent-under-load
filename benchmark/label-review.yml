# The 17 captures labelled false positive, for a label review.
#
# Everything here comes from Security-Datasets' own metadata at the commit the
# corpus is pinned to (d9d40ef): the recording's title, its description, its
# ATT&CK mapping and the tool that produced it.
#
# None of the 17 is mapped to T1003 by the dataset. Some still touch LSASS on
# purpose, which is what the two questions per capture are for:
#
#   credential_theft: is this recording credential theft from LSASS memory
#                     (T1003.001)?  yes | no | unsure
#   touches_lsass:    does the activity itself open or modify LSASS?
#                     yes | no | unsure
#
# A capture counts as clearly benign for the analysis only if
# credential_theft is "no". Fill in both, add a note where it helps, and commit
# before looking at any per-capture model result.

captures:
  - capture: collection/msf_record_mic
    id: SDWIN-200609225055
    title: "MSF Record Mic"
    attack: ["T1123"]
    tools: ["Metasploit / post"]
    description: "This dataset represents adversaries accessing the microphone of an endpoint."
    credential_theft: "no"
    touches_lsass: "no"
    note: "Records microphone audio only."
  - capture: credential_access/empire_over_pth_patch_lsass
    id: SDWIN-190319131123
    title: "Empire Over-Pass-The-Hash"
    attack: ["T1550.002"]
    tools: ["Empire / mimikataz_pth"]
    description: "This dataset represents adversaries taking a hash/key (rc4_hmac, aes256_cts_hmac_sha1, etc.) for a domain-joined user into a fully-fledged Kerberos TGT. In this case, an adversary can write the hash/key into an existing logon session (i.e. a sacrificial logon session) section in the memory content of LSASS and kick off the regular Kerberos authentication process."
    credential_theft: "no"
    touches_lsass: "yes"
    note: "Uses an already-supplied NTLM hash and patches it into LSASS; it does not extract credentials from LSASS memory."
  - capture: defense_evasion/auditpol_system_user_auditpolicy_modification
    id: SDWIN-220630130349
    title: "Disabling Windows Event Logging via Audit Policy Modification"
    attack: ["T1562.002"]
    tools: ["auditpol.exe / auditpol.exe"]
    description: "After getting a shell with elevated privileges on the target, we used auditpol.exe to modify the current system and user audit policies. Success and failure events were disabled using the /set /remove /clear commands and /success /failure parameters. This dataset was generated using a Windows 10 Pro edition (Version:1903,OS Build:18362.30) and Kali Linux (Version:2022.2)."
    credential_theft: "no"
    touches_lsass: "no"
    note: "Changes audit policy only."
