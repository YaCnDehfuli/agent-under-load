<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Reference performance versus forced alert-only guesses for four models</title>
<desc id="desc">Reference macro F1 and 95 percent capture intervals: Luna 0.73, DeepSeek 0.59, gpt-oss 20b 0.57, gpt-oss 120b 0.46. Forced alert-only guesses: 0.37, 0.52, 0.54 and 0.57. The preregistered within-rule Luna comparison improves by 0.40 macro F1.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d2635"/><stop offset="1" stop-color="#16455a"/></linearGradient></defs>
<style>text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.k{fill:#93c5d2;font-size:16px;font-weight:700;letter-spacing:3px}.head{fill:#f4faf9;font-size:36px;font-weight:760;letter-spacing:-1.5px}.axis{fill:#adc5cb;font-size:14px}.label{fill:#f2f8f8;font-size:20px;font-weight:650}.num{fill:#f4faf9;font-size:19px;font-weight:700}.small{fill:#b8cdd2;font-size:15px}.grid{stroke:#3f6573;stroke-width:1}.ci{stroke:#72d5c5;stroke-width:5;stroke-linecap:round}.link{stroke:#6c98a1;stroke-width:2}.ref{fill:#72d5c5;stroke:#123846;stroke-width:3}.guess{fill:#123846;stroke:#e5ab70;stroke-width:3}</style>
<rect width="1200" height="500" rx="22" fill="url(#bg)"/>
<text x="55" y="58" class="k">MODEL COMPARISON  /  TRIAGE REFERENCE</text>
<text x="55" y="103" class="head">Investigating helped one model most clearly</text>
<text x="55" y="133" class="small">Macro-F1 on 80 cases; whiskers show 95% capture-bootstrap intervals.</text>
<g class="grid"><line x1="220" y1="177" x2="220" y2="406"/><line x1="380" y1="177" x2="380" y2="406"/><line x1="540" y1="177" x2="540" y2="406"/><line x1="700" y1="177" x2="700" y2="406"/><line x1="860" y1="177" x2="860" y2="406"/><line x1="1020" y1="177" x2="1020" y2="406"/></g>
<line x1="702" y1="176" x2="702" y2="409" stroke="#d1e2e3" stroke-width="1.4" stroke-dasharray="5 6"/>
<g class="axis" text-anchor="middle"><text x="220" y="432">0.0</text><text x="380" y="432">0.2</text><text x="540" y="432">0.4</text><text x="700" y="432">0.6</text><text x="860" y="432">0.8</text><text x="1020" y="432">1.0</text></g>
<g class="label"><text x="55" y="213">gpt-6-luna</text><text x="55" y="278">deepseek-v4-pro</text><text x="55" y="343">gpt-oss-20b</text><text x="55" y="408">gpt-oss-120b</text></g>
<g class="link"><line x1="512" y1="207" x2="806" y2="207"/><line x1="633" y1="272" x2="694" y2="272"/><line x1="654" y1="337" x2="677" y2="337"/><line x1="680" y1="402" x2="587" y2="402"/></g>
<g class="ci"><line x1="697" y1="207" x2="906" y2="207"/><line x1="586" y1="272" x2="782" y2="272"/><line x1="572" y1="337" x2="790" y2="337"/><line x1="494" y1="402" x2="682" y2="402"/></g>
<g class="guess"><circle cx="512" cy="207" r="9"/><circle cx="633" cy="272" r="9"/><circle cx="654" cy="337" r="9"/><circle cx="680" cy="402" r="9"/></g>
<g class="ref"><circle cx="806" cy="207" r="11"/><circle cx="694" cy="272" r="11"/><circle cx="677" cy="337" r="11"/><circle cx="587" cy="402" r="11"/></g>
<g class="num"><text x="923" y="214">0.73</text><text x="799" y="279">0.59</text><text x="807" y="344">0.57</text><text x="700" y="409">0.46</text></g>
<line x1="55" y1="456" x2="1145" y2="456" stroke="#4e7988"/>
<circle cx="70" cy="478" r="7" fill="#72d5c5"/><text x="85" y="483" class="small">reference</text><circle cx="206" cy="478" r="6" fill="#123846" stroke="#e5ab70" stroke-width="3"/><text x="220" y="483" class="small">forced alert guess</text><text x="486" y="483" class="small">Within six shared rules: Luna 0.72 with telemetry vs 0.32 from the alert</text>
</svg>
