<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Agent Under Load: the agent loop, evidence boundary and measured result</title>
<desc id="desc">A LangGraph loop routes preparation to investigation, tool queries, validation and a verdict. Querying full event fields crosses the adversary writable boundary. A measured within-rule comparison shows 0.72 macro F1 with telemetry and 0.32 from an alert-only forced guess.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d2635"/><stop offset="1" stop-color="#16455a"/></linearGradient>
  <linearGradient id="accent" x2="1"><stop stop-color="#67d5ca"/><stop offset="1" stop-color="#b6e0a1"/></linearGradient>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#8bafbd"/></marker>
</defs>
<style>
text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.k{fill:#93c5d2;font-size:16px;font-weight:700;letter-spacing:3px}.head{fill:#f4faf9;font-size:42px;font-weight:750;letter-spacing:-1.8px}.sub{fill:#b7ced3;font-size:18px}.small{fill:#adc4ce;font-size:14px}.label{fill:#eef7f7;font-size:19px;font-weight:700}.tiny{fill:#a9bdc6;font-size:13px}.num{fill:#f1faf6;font-size:39px;font-weight:780}.line{stroke:#8bafbd;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.soft{stroke:#598493;stroke-width:1.4;fill:none}.box{fill:#163c4c;stroke:#528a96;stroke-width:1.4}.highlight{fill:#1c525c;stroke:#75cabc;stroke-width:2}.tool{fill:#102f3e;stroke:#527a89;stroke-width:1}
</style>
<rect width="1200" height="690" rx="22" fill="url(#bg)"/>
<text x="62" y="64" class="k">AGENT UNDER LOAD  /  SYSTEM AND RESULT</text>
<text x="62" y="116" class="head">Does the verdict follow the evidence?</text>
<text x="62" y="149" class="sub">LangGraph investigation, constrained tools and a paired test with the alert held fixed.</text>
<line x1="62" y1="179" x2="1138" y2="179" stroke="#4e7988"/>
<text x="62" y="219" class="k">01  INVESTIGATION LOOP</text>
<rect x="62" y="250" width="164" height="86" rx="13" class="box"/><text x="83" y="286" class="label">prepare</text><text x="83" y="309" class="tiny">prompt + case</text>
<rect x="286" y="250" width="198" height="86" rx="13" class="highlight"/><text x="309" y="286" class="label">investigate</text><text x="309" y="309" class="tiny">model + tool calls</text>
<rect x="546" y="250" width="174" height="86" rx="13" class="box"/><text x="570" y="286" class="label">validate</text><text x="570" y="309" class="tiny">schema + citations</text>
<rect x="782" y="250" width="144" height="86" rx="13" class="box"/><text x="805" y="286" class="label">finish</text><text x="805" y="309" class="tiny">record verdict</text>
<path d="M226 293H281M484 293H541M720 293H777" class="line"/>
<path d="M633 340v42q0 24-24 24H390q-24 0-24-24v-39" class="line"/><text x="453" y="399" class="tiny">one repair if rejected</text>
<path d="M385 342v40" class="soft"/><text x="62" y="381" class="small">12 turn limit · serializable state · hash chained audit</text>
<text x="62" y="452" class="k">02  TOOL EVIDENCE BOUNDARY</text>
<rect x="62" y="475" width="522" height="102" rx="12" class="tool"/>
<text x="84" y="505" class="label">Lower exposure</text><text x="84" y="532" class="small">lookup_rule · describe_capture · count_events</text><text x="84" y="555" class="tiny">rule text, event types, field presence and counts</text>
<rect x="601" y="475" width="537" height="102" rx="12" fill="#443e38" stroke="#c59e70" stroke-width="1.5"/>
<text x="623" y="505" class="label">Adversary writable field values</text><text x="623" y="532" class="small">query_events returns full event content</text><text x="623" y="555" class="tiny">the prompt injection channel; provenance is logged</text>
<line x1="62" y1="607" x2="1138" y2="607" stroke="#4e7988"/>
<text x="62" y="646" class="k">03  WITHIN SIX SHARED RULES</text>
<text x="490" y="651" class="num">0.72</text><text x="590" y="647" class="small">with telemetry</text>
<text x="784" y="651" class="num">0.32</text><text x="884" y="647" class="small">alert-only guess</text>
<rect x="62" y="663" width="1076" height="5" rx="2" fill="#395f69"/><rect x="62" y="663" width="429" height="5" rx="2" fill="url(#accent)"/>
</svg>
