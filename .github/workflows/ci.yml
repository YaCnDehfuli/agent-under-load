name: ci

# Actions are pinned to a commit sha, with the release tag in the trailing
# comment so a reader can verify the pair. A tag — including a major-version
# tag like v4 — is a mutable pointer the action's owner can move, and these
# actions run with the repository checked out and, in the gitleaks job, with a
# GITHUB_TOKEN in the environment. requirements.txt already pins for this
# reason; the workflow is the other half of the same argument.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # the pins do not move, but the toolchain resolves fresh, so this catches a
    # pySigma or langgraph release breaking the harness
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  tests:
    # the unit suite touches no corpus and needs no API key, so it runs on every
    # push. corpus- and model-marked tests skip themselves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: what is being run
        # a drift failure is only diagnosable if the log says which toolchain
        # produced it
        run: |
          echo "commit: $(git rev-parse HEAD)"
          pip list 2>/dev/null | grep -iE "^(pysigma|langgraph|pydantic|anthropic)" || true
      - run: python -m pytest tests -q
      - name: the unit suite must not depend on the corpus
        # a test that quietly needs data is a test that fails for the wrong
        # reason on someone else's machine
        run: DETECTION_UNDER_LOAD=/nonexistent python -m pytest tests -q

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - name: bandit
        # B101 (assert) is excluded in tests only: pytest is built on assert.
        run: |
          bandit -r agent attack score -f txt
          bandit -r tests -f txt --skip B101
      - name: semgrep
        run: semgrep --config p/python --config p/security-audit --error --quiet

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - name: pip-audit
        # Advisories against the pinned versions, since the pins are what a
        # reader would install. One advisory is ignored with a reason:
        #
        #   PYSEC-2026-2447 / CVE-2025-69872 — diskcache <=5.6.3 deserialises
        #   cache entries with pickle, so an attacker who can write the cache
        #   directory gets code execution. diskcache arrives transitively via
        #   pySigma and there is no fixed version published, so it cannot be
        #   pinned away. Exploitation needs local write access to the cache
        #   directory, which in this repo is a developer's own machine or an
        #   ephemeral CI runner. Reassessed whenever a fix ships; see the README.
        #
        # Everything else still fails the build, so a new advisory is not
        # silently absorbed by this exception.
        run: |
          pip-audit -r requirements.txt --strict \
            --ignore-vuln PYSEC-2026-2447

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  scored-run:
    # The baseline is reproducible with no API key, so CI can re-derive the
    # committed numbers and fail if they drift. The agent and attack runs need a
    # model and are not run here.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: fetch the sibling repo, which holds the ground truth
        run: git clone --depth 1 https://github.com/YaCnDehfuli/detection-under-load ../detection-under-load
      - name: cache corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: corpus
          key: corpus-${{ hashFiles('../detection-under-load/benchmark/manifest.yml') }}
      - name: fetch and verify the pinned corpus
        run: python -m agent.corpus --fetch
      - run: python -m agent.corpus --list
      - name: the corpus-backed tests
        run: python -m pytest tests -q -m corpus
      - name: re-derive the committed baseline numbers
        run: |
          python -m score.run --task triage --predictor baseline --out runs/triage.json
          python -m score.run --task miss    --predictor baseline --out runs/miss.json
      - name: committed results must match a fresh run
        # if the sibling repo reruns and its labels move, this fails and the
        # numbers in docs/ are stale — which is the point
        run: |
          python - <<'PY'
          import json, sys
          bad = []
          for name, fresh in (("triage", "runs/triage.json"), ("miss", "runs/miss.json")):
              committed = json.load(open(f"benchmark/{name}-baseline.json"))["report"]
              current = json.load(open(fresh))["report"]
              for key in ("per_class", "total", "unanswered"):
                  if committed[key] != current[key]:
                      bad.append(f"{name}: {key} drifted")
          print("\n".join(bad) if bad else "committed results match")
          sys.exit(1 if bad else 0)
          PY
