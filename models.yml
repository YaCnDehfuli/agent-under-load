# Models the study can run, by key: `python -m score.run --model <key> ...`
#
# `params` are merged into the request body verbatim, so each entry records
# exactly what was sent. `temperature: null` means the field is omitted, for
# models that reject it. Reasoning effort is fixed per model and never varied
# between conditions.
#
# Prices are USD per million tokens, copied from the provider's pricing page with
# the page and the date it was checked. A null price means cost is recorded as
# unknown rather than estimated. The prices below came from third-party trackers
# because the provider pages were not reachable when they were filled in; confirm
# them on the provider's own page before a full run.
#
# Where billing is uncertain the rate is the higher one, so a recorded cost is an
# upper bound: OpenAI entries use standard rates although Flex bills about half.
#
# `budget_usd` is a lifetime cap for the model, counted across every run
# directory under runs/. The caps plus smoke runs ($1), the adversarial phase
# ($6) and a reserve ($9) add up to the study's $50.

qwen3-4b:
  provider: ollama
  base_url: http://127.0.0.1:11434/v1
  api_key_env: ""
  model: qwen3:4b
  temperature: 0
  params: {max_tokens: 4096}
  price: {input: 0, cached_input: 0, output: 0, source: local, checked: null}
  budget_usd: 0

gpt-oss-20b:
  provider: groq
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  model: openai/gpt-oss-20b
  temperature: 0
  params: {max_completion_tokens: 4096, reasoning_effort: low}
  price: {input: 0.075, cached_input: 0.0375, output: 0.30, source: https://www.layer3labs.io/guides/groq-pricing, checked: "2026-09-23"}
  budget_usd: 4

