# Models the study can run, by key: `python -m score.run --model <key> ...`
#
# `params` are merged into the request body verbatim, so each entry records
# exactly what was sent. `temperature: null` means the field is omitted, for
# models that reject it. Reasoning effort is fixed per model and never varied
# between conditions.
#
# Prices are USD per million tokens, copied from the provider's pricing page with
# the page and the date it was checked. A null price means cost is recorded as
# unknown rather than estimated. The prices below came from third-party trackers
# because the provider pages were not reachable when they were filled in; confirm
# them on the provider's own page before a full run.
#
# Where billing is uncertain the rate is the higher one, so a recorded cost is an
# upper bound: OpenAI entries use standard rates although Flex bills about half.
#
# `budget_usd` is a lifetime cap for the model, counted across every run
# directory under runs/, smoke runs included. The OpenRouter caps (20b + 120b)
# and the OpenAI caps (Luna + Sol) each fit inside $10 of credit; DeepSeek draws
# on its own account. Later phases spend from the same caps.

qwen3-4b:
  provider: ollama
  base_url: http://127.0.0.1:11434/v1
  api_key_env: ""
  model: qwen3:4b
  temperature: 0
  params: {max_tokens: 4096}
  # CPU inference: a single turn has taken close to three minutes
  timeout_s: 1800
  price: {input: 0, cached_input: 0, output: 0, source: local, checked: null}
  budget_usd: 0

gpt-oss-20b:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: openai/gpt-oss-20b
  temperature: 0
  # only hosts that honour tools and the reasoning setting, cheapest first;
  # the host that served each call is recorded as served_by. Darkbloom failed 8
  # of 27 generations in the smoke run and is left out.
  params:
    max_tokens: 4096
    reasoning: {effort: medium}  # the model's default, fixed before any results
    usage: {include: true}
    provider: {require_parameters: true, sort: price, ignore: [Darkbloom]}
  # OpenRouter reports what each call cost and that figure is what gets recorded.
  # These rates are the fallback: an upper bound, since hosts on OpenRouter start
  # around $0.018 / $0.09
  price: {input: 0.075, cached_input: 0.0375, output: 0.30, source: https://openrouter.ai/openai/gpt-oss-20b, checked: "2026-09-23"}
  budget_usd: 3

gpt-oss-120b:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: openai/gpt-oss-120b
  temperature: 0
  params:
    max_tokens: 4096
    reasoning: {effort: medium}  # the model's default, fixed before any results
    usage: {include: true}
    provider: {require_parameters: true, sort: price}
  # fallback rates as above; hosts start around $0.03 / $0.17
  price: {input: 0.15, cached_input: 0.075, output: 0.60, source: https://openrouter.ai/openai/gpt-oss-120b, checked: "2026-09-23"}
  budget_usd: 6

gpt-6-luna:
  provider: openai
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY_LUNA
  model: gpt-6-luna
  temperature: null
  # tool calls over Chat Completions need reasoning_effort=none on this family
  params: {max_completion_tokens: 4096, reasoning_effort: none, service_tier: flex}
  price: {input: 0.10, cached_input: 0.01, output: 0.50, source: https://www.digitalapplied.com/blog/gpt-6-sol-luna-launch-pricing-benchmarks-2026, checked: "2026-09-23"}
  budget_usd: 3

gpt-6-sol:
  provider: openai
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY_LUNA
  model: gpt-6-sol
  temperature: null
  params: {max_completion_tokens: 4096, reasoning_effort: none, service_tier: flex}
  price: {input: 2.00, cached_input: 0.20, output: 10.00, source: https://www.digitalapplied.com/blog/gpt-6-sol-luna-launch-pricing-benchmarks-2026, checked: "2026-09-23"}
  budget_usd: 6.5

deepseek-v4-pro:
  provider: deepseek
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-v4-pro
  temperature: 0
  params: {max_tokens: 4096}
  # off-peak rates: run it outside 01:00-04:00 and 06:00-10:00 UTC on weekdays,
  # when every rate doubles
  price: {input: 0.66, cached_input: 0.022, output: 1.98, source: https://www.morphllm.com/deepseek-api, checked: "2026-09-23"}
  # the smoke run measured $0.0117 a trajectory, so $14 for the full matrix
  budget_usd: 16

claude-sonnet-5:
  provider: anthropic
  api_key_env: ANTHROPIC_API_KEY
  model: claude-sonnet-5
  temperature: 0
  price: {input: null, cached_input: null, output: null, source: null, checked: null}
  budget_usd: 0